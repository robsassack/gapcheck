name: Package Chrome extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run type checks
        run: npm run typecheck

      - name: Verify tagged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$manifest_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest_version." >&2
            exit 1
          fi

      - name: Build production package
        run: npm run package:extension

      - name: Upload production package
        uses: actions/upload-artifact@v7
        with:
          name: gapcheck-production
          path: |
            dist/gapcheck-*.zip
            dist/gapcheck-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
